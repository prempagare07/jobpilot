[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Local-first job application automation for macOS Apple Silicon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "SQLAlchemy>=2.0",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.2",
  "ollama>=0.4",
  "chromadb>=0.5",
  "APScheduler>=3.10,<4",
  "playwright>=1.48",
  "playwright-stealth>=1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "linkedin-jobs-scraper>=4.1",
  "python-jobspy>=1.1",
  "pypdf>=5.0",
  "alembic>=1.13",
  "patchright>=1.50",
  "camoufox>=0.4",
  "SpeechRecognition>=3.10",
  "pydub>=0.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
